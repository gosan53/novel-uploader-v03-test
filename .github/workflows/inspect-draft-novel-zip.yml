name: Inspect novel ZIP from draft release (read only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Find and download exact draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED: 179_robot_public5_ch01-16_UPDATE_JUMP_FIX.zip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, pathlib
          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED']
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(url, accept=None):
              h = dict(headers)
              if accept: h['Accept'] = accept
              return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=90)
          release_id = 420273060
          try:
              with get(f'https://api.github.com/repos/{repo}/releases/{release_id}') as r:
                  rel = json.load(r)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'Cannot read draft release ID {release_id}: HTTP {exc.code}. Check Actions token permissions for draft releases.')
          if not rel.get('draft') or rel.get('name') != 'v0.4 Android ZIP 上傳測試':
              raise SystemExit('Release ID exists but title or draft state does not match; stopping safely.')
          assets = [a for a in rel.get('assets', []) if a['name'] == expected]
          if len(assets) != 1:
              raise SystemExit(f'Expected exactly one matching ZIP asset; found {len(assets)}')
          a = assets[0]
          if a.get('state') != 'uploaded' or not (1 < a['size'] < 150 * 1024 * 1024):
              raise SystemExit('Asset not fully uploaded or unexpected size')
          with get(a['url'], 'application/octet-stream') as r, open('novel.zip', 'wb') as out:
              import shutil
              shutil.copyfileobj(r, out)
          if pathlib.Path('novel.zip').stat().st_size != a['size']:
              raise SystemExit('Downloaded file size mismatch')
          pathlib.Path('asset_metadata.json').write_text(json.dumps({'name':a['name'],'size':a['size'],'digest':a.get('digest')},ensure_ascii=False))
          PY

      - name: Verify SHA-256 and ZIP structure (no extraction)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          p=pathlib.Path('novel.zip')
          m=json.loads(pathlib.Path('asset_metadata.json').read_text())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          if m.get('digest') and m['digest'] != 'sha256:'+digest:
              raise SystemExit('GitHub asset SHA-256 mismatch')
          with zipfile.ZipFile(p) as z:
              entries=z.infolist()
              if not entries or len(entries)>20000 or sum(i.file_size for i in entries)>500*1024*1024:
                  raise SystemExit('Unexpected ZIP structure or size')
              names=[i.filename.replace('\\','/') for i in entries]
              if any(n.startswith('/') or '..' in n.split('/') for n in names):
                  raise SystemExit('Unsafe ZIP path')
              if not any(n=='index.html' or (n.count('/')==1 and n.endswith('/index.html')) for n in names):
                  raise SystemExit('index.html not found')
              bad=z.testzip()
              if bad: raise SystemExit('Corrupt ZIP member: '+bad)
          summary=f"## Read-only ZIP check: PASS\n\n- File: `{m['name']}`\n- Bytes: {m['size']:,}\n- SHA-256: `{digest}`\n- ZIP entries: {len(entries)}\n- index.html found\n- No deployment, release publication, or repository writes.\n"
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(summary)
          print(summary)
          PY
