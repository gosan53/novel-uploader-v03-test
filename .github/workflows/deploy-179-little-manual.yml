name: Validate 179 / optionally deploy LITTLE only

on:
  workflow_dispatch:
    inputs:
      deploy_little:
        description: 'Deploy to little-darkness-5326? Leave unchecked for validation only'
        required: true
        type: boolean
        default: false
      confirm_target:
        description: 'For deployment type exactly little-darkness-5326; leave blank for validation'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: isolated-little-release-179
  cancel-in-progress: false

jobs:
  little:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce explicit target confirmation
        env:
          DEPLOY: ${{ inputs.deploy_little }}
          TARGET: ${{ inputs.confirm_target }}
        run: |
          if [[ "$DEPLOY" == "true" && "$TARGET" != "little-darkness-5326" ]]; then
            echo "::error::Explicit little-only confirmation required"
            exit 1
          fi

      - name: Download exact draft ZIP and validate digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, pathlib, hashlib, zipfile, shutil, stat
          repo=os.environ['GH_REPO']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url, accept=None):
              h=dict(headers)
              if accept: h['Accept']=accept
              return urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=120)
          with request(f'https://api.github.com/repos/{repo}/releases/420273060') as r:
              release=json.load(r)
          if not release.get('draft') or release.get('name')!='v0.4 Android ZIP 上傳測試':
              raise SystemExit('Draft release identity mismatch')
          name='179_robot_public5_ch01-16_UPDATE_JUMP_FIX.zip'
          assets=[a for a in release['assets'] if a['name']==name and a['state']=='uploaded']
          if len(assets)!=1: raise SystemExit('Expected one uploaded asset')
          a=assets[0]
          expected='08eaeed93f077d9eee119733b79464205b6326ea68edbca9e61b0728ecc33ab3'
          if a['size']!=79062993 or a.get('digest')!='sha256:'+expected:
              raise SystemExit('Asset metadata does not match pinned version 179')
          with request(a['url'],'application/octet-stream') as r, open('novel.zip','wb') as f:
              shutil.copyfileobj(r,f)
          if pathlib.Path('novel.zip').stat().st_size!=a['size']: raise SystemExit('Size mismatch')
          actual=hashlib.file_digest(open('novel.zip','rb'),'sha256').hexdigest()
          if actual!=expected: raise SystemExit('SHA-256 mismatch')
          out=pathlib.Path('extracted')
          out.mkdir()
          with zipfile.ZipFile('novel.zip') as z:
              entries=z.infolist()
              if not entries or len(entries)>20000 or sum(x.file_size for x in entries)>500*1024*1024:
                  raise SystemExit('ZIP limits exceeded')
              for x in entries:
                  n=x.filename.replace('\\','/')
                  parts=pathlib.PurePosixPath(n).parts
                  mode=(x.external_attr>>16)&0o170000
                  if n.startswith('/') or '..' in parts or (parts and ':' in parts[0]) or mode in (stat.S_IFLNK,stat.S_IFCHR,stat.S_IFBLK):
                      raise SystemExit('Unsafe ZIP member: '+n)
              if z.testzip(): raise SystemExit('ZIP CRC failure')
              z.extractall(out)
          if not (out/'index.html').is_file():
              children=[p for p in out.iterdir() if p.name!='__MACOSX']
              if len(children)!=1 or not children[0].is_dir() or not (children[0]/'index.html').is_file():
                  raise SystemExit('index.html missing or unexpected nesting')
              nested=children[0]
              for item in nested.iterdir(): shutil.move(str(item),str(out/item.name))
              nested.rmdir()
          print('PASS: pinned version 179, digest, CRC, and root index.html')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## ZIP 179 validation PASS\n\nExact SHA-256 verified. Deployment only if explicitly confirmed.\n')
          PY

      - name: Confirm test-site Cloudflare credentials
        if: ${{ inputs.deploy_little == true }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Missing test-site Cloudflare secrets; no deployment performed"
            exit 1
          fi

      - name: Deploy only LITTLE test Worker
        if: ${{ inputs.deploy_little == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --name little-darkness-5326 --assets ./extracted --compatibility-date 2026-10-19

      - name: Validation-only summary
        if: ${{ inputs.deploy_little != true }}
        run: echo 'Validation only. No website changed.' >> "$GITHUB_STEP_SUMMARY"
